<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contacter Emilie Roupsard, web designer.">
    <title>Contact — Emilie Roupsard</title>
    <link rel="icon" type="image/png" href="assets/Logo-Emilie.png">
    <link rel="preload" href="assets/fonts/Italianno.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="page-contact">

    <div class="page-transition" aria-hidden="true"></div>

    <div class="logo-watermark" aria-hidden="true">
        <img src="assets/Logo-Emilie.png" alt="">
    </div>

    <nav class="nav">
        <a href="index.html" class="nav-logo">
            <img src="assets/Logo-Emilie.png" alt="Emilie Roupsard">
        </a>
        <button class="nav-burger" aria-label="Menu">
            <span></span><span></span><span></span>
        </button>
        <ul class="nav-links">
            <li><a href="index.html">Accueil</a></li>
            <li><a href="apropos.html">À propos</a></li>
            <li><a href="portfolio.html">Projets</a></li>
            <li><a href="contact.html" class="active">Contact</a></li>
        </ul>
    </nav>

    <main class="projects-main">
        <section class="contact-section">

            <div class="contact-grid">

                <div class="contact-info reveal-section">
                    <span class="about-label">Contact</span>
                    <h1 class="contact-title">Travaillons<br><em>ensemble.</em></h1>
                    <p class="contact-lead">Une idée, un projet, une question ?<br>Je suis disponible et à l'écoute.</p>

                    <div class="contact-details">

                        <a href="mailto:emi.roupsard@gmail.com" class="contact-detail-item">
                            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                            emi.roupsard@gmail.com
                        </a>

                        <div class="contact-detail-item">
                            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 010-5 2.5 2.5 0 010 5z" fill="currentColor" opacity="0.8"/>
                            </svg>
                            France — Full remote
                        </div>

                        <a href="https://www.linkedin.com/in/emilie-roupsard-15a058191/" target="_blank" rel="noopener noreferrer" class="contact-detail-item">
                            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M16 8a6 6 0 016 6v7h-4v-7a2 2 0 00-2-2 2 2 0 00-2 2v7h-4v-7a6 6 0 016-6zM2 9h4v12H2z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                                <circle cx="4" cy="4" r="2" stroke="currentColor" stroke-width="1.5"/>
                            </svg>
                            LinkedIn
                        </a>

                    </div>
                </div>

                <form class="contact-form reveal-section" id="contactForm" novalidate>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="contact-name">Nom</label>
                            <input type="text" id="contact-name" name="name" placeholder="Votre nom" required autocomplete="name">
                        </div>
                        <div class="form-group">
                            <label for="contact-email">Email</label>
                            <input type="email" id="contact-email" name="email" placeholder="votre@email.com" required autocomplete="email">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="contact-subject">Sujet</label>
                        <input type="text" id="contact-subject" name="subject" placeholder="Objet de votre message" required>
                    </div>

                    <div class="form-group">
                        <label for="contact-message">Message</label>
                        <textarea id="contact-message" name="message" rows="6" placeholder="Dites-moi tout..." required></textarea>
                    </div>

                    <div class="form-status" id="formStatus" aria-live="polite"></div>

                    <button type="submit" class="btn-contact-submit">
                        <span>Envoyer le message</span>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                            <path d="M5 12h14M12 5l7 7-7 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>

                </form>

            </div>

        </section>
    </main>

    <footer class="footer">
        <span>© <span id="year"></span> Emilie Roupsard</span>
        <div class="footer-socials">
            <a href="https://www.linkedin.com/in/emilie-roupsard-15a058191/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
            <a href="mentions-legales.html">Mentions légales</a>
        </div>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
