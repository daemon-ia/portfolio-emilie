<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Démo — Mask SVG Transition</title>
<link rel="icon" type="image/png" href="../assets/Logo-Emilie.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Italianno&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
        --bg: #121212;
        --bg-2: #1C1C1C;
        --secondary: #C8A882;
        --secondary-dark: #A47864;
        --text: #F5F0ED;
        --text-soft: #B8A89C;
        --border: rgba(200, 168, 130, 0.25);
        --ease: cubic-bezier(0.77, 0, 0.18, 1);
    }

    body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        overflow: hidden;
    }
    a { color: inherit; text-decoration: none; }

    .stage {
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
    }

    /* VUE A */
    .view-a {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        z-index: 1;
    }
    .view-a h1 {
        font-family: 'Italianno', cursive;
        font-weight: 400;
        font-size: clamp(3.5rem, 9vw, 6rem);
        line-height: 1;
        margin-bottom: 0.5rem;
    }
    .view-a .role {
        font-size: 0.9rem;
        letter-spacing: 0.35em;
        text-transform: uppercase;
        color: var(--secondary-dark);
        margin-bottom: 4rem;
    }
    .view-a .trigger {
        background: transparent;
        border: none;
        color: var(--text);
        font-family: inherit;
        font-size: 1rem;
        cursor: pointer;
        padding: 0.5rem 0;
    }
    .view-a .trigger span {
        position: relative;
        display: inline-block;
        padding-bottom: 8px;
    }
    .view-a .trigger span::after {
        content: '';
        position: absolute;
        left: 0; right: 0; bottom: 0;
        height: 1.5px;
        background: var(--secondary);
        transform: scaleX(0);
        transform-origin: left;
        transition: transform 0.6s var(--ease);
    }
    .view-a .trigger:hover span::after { transform: scaleX(1); }

    /* VUE B */
    .view-b {
        position: absolute;
        inset: 0;
        padding: 6rem 2rem 2rem;
        z-index: 3;
        clip-path: inset(0 100% 0 0);
        transition: clip-path 1.4s var(--ease);
        background: var(--bg);
    }
    body.transitioning .view-b {
        clip-path: inset(0 0 0 0);
    }
    .view-b h2 {
        font-family: 'Italianno', cursive;
        font-weight: 400;
        font-size: clamp(3rem, 7vw, 5rem);
        line-height: 1;
        margin-bottom: 0.5rem;
    }
    .view-b .label {
        font-size: 0.85rem;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: var(--secondary-dark);
        margin-bottom: 3rem;
    }
    .view-b .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 1.5rem;
        max-width: 1000px;
        margin: 0 auto;
    }
    .view-b .card {
        background: var(--bg-2);
        aspect-ratio: 4/3;
        border-radius: 16px;
        border: 1px solid var(--border);
        display: flex;
        align-items: flex-end;
        padding: 1rem;
        font-size: 0.9rem;
        color: var(--text-soft);
    }
    .view-b .back {
        position: absolute;
        bottom: 2rem;
        right: 2rem;
        font-size: 0.85rem;
        color: var(--secondary);
        cursor: pointer;
        background: none;
        border: 1px solid var(--secondary);
        padding: 0.6rem 1.2rem;
        border-radius: 50px;
        font-family: inherit;
        transition: all 0.3s var(--ease);
    }
    .view-b .back:hover {
        background: var(--secondary);
        color: var(--bg);
    }

    /* MASK SVG ONDULÉ — fait le wipe */
    .mask-wipe {
        position: fixed;
        inset: 0;
        z-index: 5;
        pointer-events: none;
    }
    .mask-wipe svg {
        position: absolute;
        top: 0;
        left: -100%;
        width: 200%;
        height: 100%;
        transition: transform 1.4s var(--ease);
    }
    body.transitioning .mask-wipe svg {
        transform: translateX(100%);
    }
    body.untransitioning .mask-wipe svg {
        transform: translateX(200%);
        transition: transform 1.4s var(--ease);
    }

    /* SWITCHER */
    .nav-bar {
        position: fixed;
        top: 16px;
        right: 16px;
        z-index: 200;
        background: rgba(28, 28, 28, 0.9);
        backdrop-filter: blur(20px);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 50px;
        padding: 0.4rem;
        display: flex;
        gap: 0.25rem;
        font-size: 0.78rem;
    }
    .nav-bar a {
        padding: 0.5rem 0.9rem;
        border-radius: 50px;
        opacity: 0.65;
        transition: all 0.3s ease;
    }
    .nav-bar a:hover { opacity: 1; }
    .nav-bar a.active {
        background: var(--secondary);
        color: var(--bg);
        opacity: 1;
    }
</style>
</head>
<body>

    <div class="stage">
        <!-- VUE A : ACCUEIL -->
        <section class="view-a">
            <h1>Emilie Roupsard</h1>
            <p class="role">Webdesigner</p>
            <button class="trigger" id="go-portfolio">
                <span>Voir mon portfolio</span>
            </button>
        </section>

        <!-- VUE B : PORTFOLIO -->
        <section class="view-b">
            <h2>Mon portfolio</h2>
            <p class="label">— Sélection 2026</p>
            <div class="grid">
                <div class="card">Projet 01</div>
                <div class="card">Projet 02</div>
                <div class="card">Projet 03</div>
                <div class="card">Projet 04</div>
            </div>
            <button class="back" id="go-back">← Retour</button>
        </section>
    </div>

    <!-- MASK ONDULÉ qui révèle pendant la transition -->
    <div class="mask-wipe">
        <svg viewBox="0 0 200 100" preserveAspectRatio="none">
            <path d="M 0,0
                     L 100,0
                     Q 102,15 96,25 T 104,50 T 96,75 T 100,100
                     L 0,100 Z"
                  fill="#C8A882"/>
        </svg>
    </div>

    <nav class="nav-bar">
        <a href="../index.html">◉ Site</a>
        <a href="transition-shared.html">Shared Element</a>
        <a href="transition-mask.html" class="active">Mask SVG</a>
    </nav>

<script>
    const triggerBtn = document.getElementById('go-portfolio');
    const backBtn = document.getElementById('go-back');

    triggerBtn.addEventListener('click', () => {
        document.body.classList.remove('untransitioning');
        document.body.classList.add('transitioning');
    });
    backBtn.addEventListener('click', () => {
        document.body.classList.remove('transitioning');
        document.body.classList.add('untransitioning');
        // Reset view-b clip-path
        document.querySelector('.view-b').style.transition = 'none';
        document.querySelector('.view-b').style.clipPath = 'inset(0 100% 0 0)';
        setTimeout(() => {
            document.querySelector('.view-b').style.transition = '';
        }, 50);
    });
</script>

</body>
</html>
